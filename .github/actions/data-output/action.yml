name: Data output
description: >-
  Delivers the output of a data run (§10.3): with a changed dist/ it writes the CHANGELOG
  entry and checks it, then commits to main (whose push starts release.yml), or force-pushes the
  data-update branch and creates or updates its PR, with the token of the GitHub App (D50). reports/, registry/ and the CHANGELOG are
  delivered only together with dist/. Runs only after exit 0 or 2.

inputs:
  exit-code:
    description: Exit code of the data command (0 or 2)
    required: true
  origin:
    description: What produced the output, for the PR body (e.g. `weekly-update`, `rebuild`)
    required: true
  allow-main:
    description: '`true` when exit 0 may go straight to main (weekly-update); otherwise always the PR'
    default: 'false'
  dry-run:
    description: '`true`: prepare everything, commit nothing, open no PR'
    default: 'false'
  token:
    description: Token of the GitHub App (.github/actions/app-token), created right before this step
    required: true
  git-name:
    description: Author and committer name of the data commit (the app's bot account)
    required: true
  git-email:
    description: Author and committer email of the data commit (the app's bot account)
    required: true

outputs:
  target:
    description: '`none` (dist/ unchanged), `main` or `pr`'
    value: ${{ steps.plan.outputs.target }}

runs:
  using: composite
  steps:
    - name: Plan
      id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EXIT_CODE: ${{ inputs.exit-code }}
        ALLOW_MAIN: ${{ inputs.allow-main }}
      run: |
        set -euo pipefail
        # Only dist/ decides (scripts/release.ts, `target`): changes of reports/ or registry/ alone
        # are never delivered, they go with the next change of dist/.
        git status --porcelain -- dist reports registry CHANGELOG.md
        open=$(gh pr list --head data-update --base main --state open --json number --jq length)
        target=$(npm run --silent release -- target "$EXIT_CODE" "$ALLOW_MAIN" "$open")
        echo "open data-update PRs: $open; target: $target"
        if [ "$target" = none ]; then
          echo "nothing to deliver: dist/ is unchanged"
          if [ "$EXIT_CODE" = 2 ]; then
            echo "::notice title=Nothing delivered::exit 2 (retroactive changes) but dist/ is unchanged: no commit and no PR"
          fi
          echo "target=none" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        npm run --silent release -- changelog
        npm run --silent release -- check
        data_version=$(jq -r .data_version reports/meta.json)
        {
          echo "target=$target"
          echo "data-version=$data_version"
          # The files a data run may change (the README only once it exists).
          echo 'paths<<EOF'
          printf '%s\n' dist reports registry CHANGELOG.md
          if [ -f README.md ]; then echo README.md; fi
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Commit to main
      if: steps.plan.outputs.target == 'main' && inputs.dry-run != 'true'
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        GIT_NAME: ${{ inputs.git-name }}
        GIT_EMAIL: ${{ inputs.git-email }}
        DATA_VERSION: ${{ steps.plan.outputs.data-version }}
        PATHS: ${{ steps.plan.outputs.paths }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        git add -- $PATHS
        git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" commit --quiet -m "Data update $DATA_VERSION"
        # The token reaches git through the environment of this step only: never .git/config nor the log.
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
        # Rejected when main moved during the run: the next run starts again from the new main.
        # Pushed with the app token, the commit starts release.yml by itself (D50).
        git push origin HEAD:main
        echo "pushed $(git rev-parse HEAD) to main"

    - name: PR body
      if: steps.plan.outputs.target == 'pr'
      shell: bash
      env:
        ORIGIN: ${{ inputs.origin }}
        BODY: ${{ runner.temp }}/data-update-body.md
      run: |
        set -euo pipefail
        jq -r --arg origin "$ORIGIN" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '
          "Automated data update: last updated by **\($origin)** ([run](\($run))).\n",
          "- command: `\(.command)`, today \(.today), exit code \(.exit_code) (\(.outcome))",
          "- release: \(.release.kind // "none"), data version \(.release.data_version // "-")",
          (if .release.changes then "- changes: \(.release.changes.added) added, \(.release.changes.updated) updated, \(.release.changes.removed) removed, \(.release.changes.retroactive) retroactive" else empty end),
          "- anomalies: \(.anomalies.warning) warnings, \(.anomalies.info) info",
          (if .retroactive.value then "\n**Retroactive** (review before merging):\n" + ([.retroactive.reasons[] | "- " + .] | join("\n")) else empty end),
          "\nThe branch is force-pushed by every data run with its latest output (§10.3): merging publishes it (release.yml)."
        ' .cache/last-run.json > "$BODY"
        cat "$BODY"

    - name: Create or update the data-update PR
      if: steps.plan.outputs.target == 'pr' && inputs.dry-run != 'true'
      # v8.1.1
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
      with:
        token: ${{ inputs.token }}
        branch: data-update
        base: main
        add-paths: ${{ steps.plan.outputs.paths }}
        commit-message: Data update ${{ steps.plan.outputs.data-version }} (${{ inputs.origin }})
        committer: ${{ inputs.git-name }} <${{ inputs.git-email }}>
        author: ${{ inputs.git-name }} <${{ inputs.git-email }}>
        title: Data update ${{ steps.plan.outputs.data-version }}
        body-path: ${{ runner.temp }}/data-update-body.md
