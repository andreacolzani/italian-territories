name: App delivery check

# Temporary (§10.5, "Going public" step 1): checks that a PR opened with the GitHub App token (D50)
# starts test.yml, as the data-update PR must. The commit touches no file of dist/, so merging it
# would start no release; it is never merged: the PR is closed and the branch deleted in any case.
# Delete this workflow once the check has passed.
on: workflow_dispatch

permissions: {}

concurrency:
  group: app-delivery-check
  cancel-in-progress: false

jobs:
  check:
    name: App delivery check
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the test.yml runs, read with GITHUB_TOKEN
    env:
      BRANCH: check/app-delivery-${{ github.run_id }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false # the push uses the app token

      - name: App token
        id: app
        uses: ./.github/actions/app-token
        with:
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: italian-territories

      - name: Push a commit
        id: push
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          GIT_NAME: ${{ steps.app.outputs.git-name }}
          GIT_EMAIL: ${{ steps.app.outputs.git-email }}
        run: |
          set -euo pipefail
          # The token reaches git through the environment of this step only, as in the store action.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git switch --quiet --create "$BRANCH"
          printf 'App delivery check, run %s\n' "$GITHUB_RUN_ID" > app-delivery-check.txt
          git add app-delivery-check.txt
          git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" commit --quiet -m "App delivery check (run $GITHUB_RUN_ID)"
          git push --quiet origin "HEAD:refs/heads/$BRANCH"
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pushed $sha to $BRANCH as $GIT_NAME"

      - name: Open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "App delivery check (run $GITHUB_RUN_ID)" \
            --body "Temporary PR of \`app-delivery-check.yml\` (§10.5): it checks that a PR opened with the app token starts \`test.yml\`. Closed without merging by the same run."

      - name: Wait for test.yml
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          # Started within 5 minutes, finished within 30.
          run_id=""
          for _ in $(seq 30); do
            run_id=$(gh run list --repo "$REPO" --workflow test.yml --event pull_request --commit "$SHA" \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::test.yml did not start on the PR commit $SHA within 5 minutes"
            echo "test.yml did not start on the PR of the app" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          url="https://github.com/$REPO/actions/runs/$run_id"
          echo "test.yml started on the PR: $url"
          timeout 30m gh run watch "$run_id" --repo "$REPO" --interval 30 > /dev/null || true
          result=$(gh run view "$run_id" --repo "$REPO" --json status,conclusion --jq '"\(.status) \(.conclusion)"')
          echo "test.yml: $result"
          echo "test.yml on the PR of the app: [$result]($url)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" != "completed success" ]; then
            echo "::error::test.yml on the PR did not succeed: $result"
            exit 1
          fi

      # A second token: the first one may be close to its hour after the wait.
      - name: App token for the cleanup
        id: app-end
        if: always() && steps.app.outcome == 'success'
        uses: ./.github/actions/app-token
        with:
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: italian-territories

      - name: Close the PR and delete the branch
        if: always() && steps.app-end.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-end.outputs.token }}
        run: |
          set -uo pipefail
          status=0
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --repo "$REPO" --comment "Closed by the check that opened it." || status=1
          fi
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH" || status=1
            echo "deleted $BRANCH"
          fi
          exit $status
