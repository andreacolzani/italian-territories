name: Rebuild

# The offline rebuild from the store (no network): it reproduces the last run with the current
# generator, overrides and registry, and always delivers its output as the data-update PR.
# `rebuild --refetch` (about 8 hours) is run locally by the maintainer (§10.5).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run everything and upload the artifacts, but push no store and open no PR
        type: boolean
        default: false

permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    permissions:
      # Every write (store, data commit, data-update PR) uses the GitHub App token (D50).
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false # pushes use the app token

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: App token
        id: app
        uses: ./.github/actions/app-token
        with:
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Restore the store
        id: restore
        uses: ./.github/actions/store
        with:
          mode: restore
          token: ${{ steps.app.outputs.token }}

      - name: Rebuild
        id: run
        run: |
          set +e
          node src/cli.ts rebuild 2> >(tee "$RUNNER_TEMP/run.ndjson" >&2)
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          echo "today=$(jq -r '.today // "unknown"' .cache/last-run.json 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      # The token of the first step lasts one hour, the job up to 350 minutes: a new one for the end.
      - name: App token for the end of the job
        id: app-end
        if: always() && steps.restore.outcome == 'success'
        uses: ./.github/actions/app-token
        with:
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Push the store
        if: always() && steps.app-end.outcome == 'success' && env.DRY_RUN != 'true'
        uses: ./.github/actions/store
        with:
          mode: save
          token: ${{ steps.app-end.outputs.token }}
          git-name: ${{ steps.app-end.outputs.git-name }}
          git-email: ${{ steps.app-end.outputs.git-email }}
          message: Store ${{ steps.run.outputs.today }} (rebuild, exit ${{ steps.run.outputs.exit-code }})

      - name: Upload the run summary and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebuild-run
          path: |
            .cache/last-run.json
            ${{ runner.temp }}/run.ndjson
          if-no-files-found: warn

      - name: Deliver the data
        if: steps.app-end.outcome == 'success' && (steps.run.outputs.exit-code == '0' || steps.run.outputs.exit-code == '2')
        uses: ./.github/actions/data-output
        with:
          exit-code: ${{ steps.run.outputs.exit-code }}
          origin: rebuild
          allow-main: 'false'
          dry-run: ${{ env.DRY_RUN }}
          token: ${{ steps.app-end.outputs.token }}
          git-name: ${{ steps.app-end.outputs.git-name }}
          git-email: ${{ steps.app-end.outputs.git-email }}

      - name: Verdict
        if: always() && steps.run.outcome == 'success'
        uses: ./.github/actions/data-verdict
        with:
          exit-code: ${{ steps.run.outputs.exit-code }}
