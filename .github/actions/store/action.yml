name: Store
description: >-
  Clones the snapshot store (the italian-territories-store repository) shallow into .cache/store,
  or commits and pushes it (§6.3). Clone and push go over HTTPS with the token of the GitHub App
  (D50), passed to each git command and never written to the git configuration.

inputs:
  mode:
    description: '`restore` (shallow clone) or `save` (commit and push, only when something changed)'
    required: true
  token:
    description: Token of the GitHub App (.github/actions/app-token), created right before this step
    required: true
  git-name:
    description: Committer name (save)
    default: ''
  git-email:
    description: Committer email (save)
    default: ''
  repository:
    description: The store repository
    default: andreacolzani/italian-territories-store
  path:
    description: Where the store lives (paths.store)
    default: .cache/store
  message:
    description: Commit message (save)
    default: Store

outputs:
  pushed:
    description: '`true` when save pushed a commit'
    value: ${{ steps.save.outputs.pushed }}

runs:
  using: composite
  steps:
    - name: Clone the store
      if: inputs.mode == 'restore'
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        STORE: ${{ inputs.path }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # The token reaches git through the environment of this step only: never .git/config nor the log.
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
        rm -rf "$STORE"
        mkdir -p "$(dirname "$STORE")"
        # No command reads the history of the store: one commit is enough.
        git clone --depth 1 --single-branch --no-tags "https://github.com/$REPOSITORY.git" "$STORE"
        git -C "$STORE" log -1 --format='store at %h (%cI): %s'

    - name: Commit and push the store
      id: save
      if: inputs.mode == 'save'
      shell: bash
      env:
        STORE: ${{ inputs.path }}
        MESSAGE: ${{ inputs.message }}
        GIT_NAME: ${{ inputs.git-name }}
        GIT_EMAIL: ${{ inputs.git-email }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # The token reaches git through the environment of this step only: never .git/config nor the log.
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
        if [ ! -d "$STORE/.git" ]; then
          echo "::error::$STORE is not a clone of the store repository"
          exit 1
        fi
        cd "$STORE"
        git add -A
        if git diff --cached --quiet; then
          echo "store unchanged"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" commit --quiet -m "$MESSAGE"
        git push origin HEAD
        echo "pushed=true" >> "$GITHUB_OUTPUT"
